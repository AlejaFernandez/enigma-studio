<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enigma Studio · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style id="app-style">
:root{
  --bg:#FAFAF7; --surface:#FFFFFF; --ink:#1C1C1E; --muted:#5E5E66; --line:#E4E0EE;
  --indigo:#2E1A6B; --indigo-ink:#2E1A6B; --indigo-soft:#EEEAF8;
  --accent:#00E5A0; --accent-ink:#06382A; --hero-ink:#FAFAF7;
  --danger:#B42318; --shadow:0 18px 40px -24px rgba(46,26,107,.45);
  --display:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --logo-hex:#2E1A6B; --logo-knob:var(--bg); --logo-es:#00E5A0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#120D26; --surface:#1B1536; --ink:#FAFAF7; --muted:#ABA7BD; --line:#2E2754;
    --indigo:#2E1A6B; --indigo-ink:#CBBEFF; --indigo-soft:#241C47;
    --accent:#00E5A0; --accent-ink:#06382A; --hero-ink:#FAFAF7;
    --danger:#FF8A80; --shadow:0 18px 40px -24px rgba(0,0,0,.8);
    --logo-hex:#FAFAF7; --logo-es:#2E1A6B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120D26; --surface:#1B1536; --ink:#FAFAF7; --muted:#ABA7BD; --line:#2E2754;
  --indigo:#2E1A6B; --indigo-ink:#CBBEFF; --indigo-soft:#241C47;
  --accent:#00E5A0; --accent-ink:#06382A; --hero-ink:#FAFAF7;
  --danger:#FF8A80; --shadow:0 18px 40px -24px rgba(0,0,0,.8);
    --logo-hex:#FAFAF7; --logo-es:#2E1A6B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}

/* barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:1rem;min-height:64px}
.brand{display:flex;align-items:center;gap:.6rem;font:700 1.08rem/1 var(--display);color:var(--indigo-ink);text-decoration:none;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer}
.brand svg{width:34px;height:34px;flex:none}
.nav{display:flex;gap:1.25rem;margin-left:auto}
.nav button{background:none;border:0;padding:.3rem 0;cursor:pointer;color:var(--muted);font-weight:500}
.nav button:hover{color:var(--ink)}
.tb-cta{display:flex;gap:.5rem}
.tb-cta .btn{min-height:40px;padding:.5rem .95rem;font-size:.9rem}
.tb-cta .btn-ghost{color:var(--indigo-ink)}
.cta-row{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem}
.cta-stack{display:grid;gap:.55rem}
@media (max-width:640px){.nav{display:none}.tb-cta{margin-left:auto}}
@media (max-width:480px){.tb-cta .lbl{display:none}.tb-cta .btn{padding:.5rem .7rem}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:.65rem 1.15rem;border-radius:999px;border:1.5px solid transparent;font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{filter:brightness(1.06)}
.btn-indigo{background:var(--indigo);color:#FAFAF7}
.btn-ghost{background:transparent;border-color:currentColor;color:inherit}
.btn-quiet{background:var(--indigo-soft);color:var(--indigo-ink)}
.btn-danger{background:transparent;color:var(--danger);border-color:currentColor}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}

/* hero */
.hero{background:var(--indigo);color:var(--hero-ink);overflow:hidden;position:relative}
.hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;align-items:center;gap:2rem;padding-block:clamp(3.5rem,9vw,6.5rem)}
.hero h1{font:700 clamp(2.9rem,8.4vw,6.2rem)/.94 var(--display);letter-spacing:-.035em;margin:0 0 1.4rem;max-width:11ch;text-wrap:balance}
.hero p{font-size:clamp(1.05rem,1.6vw,1.2rem);max-width:44ch;margin:0 0 2rem;color:#DCD5F5}
.hero .actions{display:flex;flex-wrap:wrap;gap:.75rem}
.hero .btn-ghost{color:#FAFAF7}
.hero-art{justify-self:end;width:100%;max-width:360px}
.hero-art svg{width:100%;height:auto;overflow:visible}
.hex-draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.6s .15s cubic-bezier(.6,0,.2,1) forwards}
.hex-pop{opacity:0;transform-origin:center;transform-box:fill-box;animation:pop .6s 1.35s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.hex-draw{stroke-dashoffset:0}.hex-pop{opacity:1}}
@media (max-width:760px){.hero .wrap{grid-template-columns:1fr}.hero-art{position:absolute;right:-70px;top:24px;width:220px;opacity:.28;pointer-events:none}}

/* barra de edición */
.adminbar{background:var(--accent);color:var(--accent-ink)}
.adminbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;padding-block:.65rem}
.adminbar strong{font-family:var(--display);margin-right:auto}
.adminbar .btn{min-height:38px;padding:.45rem .95rem;font-size:.88rem}
.adminbar .btn-indigo{background:#2E1A6B;color:#FAFAF7}
.adminbar .btn-ghost{color:var(--accent-ink)}
.adminbar .pending{font-size:.9rem;font-weight:600}

/* catálogo */
section{padding-block:clamp(3rem,7vw,5rem)}
.section-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1rem 2rem;margin-bottom:1.75rem}
.section-head h2{font:700 clamp(2rem,4.4vw,3rem)/1 var(--display);letter-spacing:-.025em;margin:0 0 .5rem;color:var(--indigo-ink)}
.section-head p{margin:0;color:var(--muted);max-width:52ch}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:2rem}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.45rem .95rem;cursor:pointer;font-size:.9rem;font-weight:500;min-height:38px}
.chip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#FAFAF7}
.search{margin-left:auto;display:flex;align-items:center;gap:.4rem;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:0 .9rem;min-height:40px}
.search input{border:0;background:none;outline:none;width:12rem;max-width:44vw;padding:.4rem 0}
.search svg{width:16px;height:16px;color:var(--muted)}
@media (max-width:640px){.search{margin-left:0;width:100%}.search input{width:100%;max-width:none}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2.25rem 1.5rem}
.item{position:relative;display:flex;flex-direction:column;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.item .ph{aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--indigo-soft);display:grid;place-items:center;transition:transform .25s ease,box-shadow .25s ease}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .ph svg{width:64px;height:64px;color:var(--indigo-ink);opacity:.35}
.item:hover .ph{transform:translateY(-3px);box-shadow:var(--shadow)}
.item .cat{margin-top:.9rem;font-size:.82rem;color:var(--muted);font-weight:500}
.item h3{font:600 1.2rem/1.25 var(--display);margin:.15rem 0 .35rem;letter-spacing:-.01em}
.item .row{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.3rem}
.item .row h3{margin:.15rem 0 0}
.item .price{font:700 1.15rem/1 var(--display);color:var(--indigo-ink);white-space:nowrap}
.item .price small,.dlg-price small{font:500 .78rem var(--body);color:var(--muted);margin-right:.25rem}
.item .meta{font-size:.88rem;color:var(--muted)}
.badge{position:absolute;top:.75rem;left:.75rem;display:inline-flex;align-items:center;gap:.35rem;background:var(--accent);color:var(--accent-ink);font-size:.78rem;font-weight:600;padding:.25rem .6rem;border-radius:999px}
.badge.off{background:var(--ink);color:var(--bg)}
.cell{display:flex;flex-direction:column}
.hidden-item .ph{opacity:.45}
.item-tools{display:flex;gap:.4rem;margin-top:.7rem}
.item-tools .btn{min-height:34px;padding:.3rem .8rem;font-size:.85rem}

.empty{border:2px dashed var(--line);border-radius:20px;padding:clamp(2rem,6vw,3.5rem);text-align:center;color:var(--muted)}
.empty h3{font:600 1.35rem var(--display);color:var(--ink);margin:0 0 .5rem}
.empty p{margin:0 auto 1.25rem;max-width:44ch}

/* cómo pedir */
.steps-band{background:var(--indigo-soft)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:52px;height:46px;margin-bottom:1rem;font:700 1.25rem var(--display);color:var(--accent-ink);background:var(--accent);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.steps h3{font:600 1.2rem/1.25 var(--display);margin:0 0 .4rem}
.steps p{margin:0;color:var(--muted)}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

footer{background:var(--indigo);color:#DCD5F5;padding-block:2.75rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1.5rem;align-items:center}
footer .brand{color:#FAFAF7;--logo-hex:#FAFAF7;--logo-knob:#2E1A6B;--logo-es:#2E1A6B;cursor:default}
footer .tag{margin:.4rem 0 0;font-size:.92rem}
footer .links{display:flex;flex-wrap:wrap;gap:.75rem}
footer .btn-ghost{color:#FAFAF7;min-height:40px}

/* diálogos */
dialog{border:0;padding:0;border-radius:22px;background:var(--surface);color:var(--ink);width:min(720px,100vw - 1.5rem);max-height:calc(100dvh - 2rem);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(18,13,38,.6);backdrop-filter:blur(3px)}
dialog[open]{animation:dlg .22s ease-out}
@keyframes dlg{from{opacity:0;transform:translateY(12px)}}
.dlg-body{padding:clamp(1.25rem,4vw,2rem);overflow:auto;max-height:calc(100dvh - 2rem)}
.dlg-close{position:absolute;top:.75rem;right:.75rem;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.15);z-index:2}
.dlg-close svg{width:18px;height:18px}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:1.75rem}
.detail .ph{border-radius:16px;overflow:hidden;background:var(--indigo-soft);aspect-ratio:1;display:grid;place-items:center}
.detail .ph img{width:100%;height:100%;object-fit:cover}
.detail .ph svg{width:80px;height:80px;color:var(--indigo-ink);opacity:.35}
.detail h2{font:700 1.75rem/1.1 var(--display);letter-spacing:-.02em;margin:.2rem 0 .6rem}
.dlg-price{font:700 1.5rem var(--display);color:var(--indigo-ink);margin:0 0 1rem}
.facts{margin:0 0 1rem;display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;font-size:.95rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:500}
.desc{margin:0 0 1.25rem;color:var(--muted);white-space:pre-line}
.opt-title{font:600 1rem var(--display);margin:0 0 .5rem}
.opts{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1rem}
.opts .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.detail textarea{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:12px;padding:.7rem .85rem;background:var(--bg);resize:vertical;margin-bottom:1rem}
.detail .btn{width:100%}
.hint{font-size:.84rem;color:var(--muted);margin:.6rem 0 0}
@media (max-width:640px){.detail{grid-template-columns:1fr}.detail .ph{aspect-ratio:4/3}}

.form h2{font:700 1.5rem var(--display);margin:0 0 1.25rem;letter-spacing:-.015em}
.form .fields{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:.35rem;font-size:.9rem;font-weight:500}
.form label span.help{font-weight:400;color:var(--muted);font-size:.82rem}
.form input[type=text],.form input[type=number],.form input[type=tel],.form textarea{border:1.5px solid var(--line);border-radius:12px;padding:.65rem .8rem;background:var(--bg);width:100%}
.form textarea{min-height:90px;resize:vertical}
.form .check{flex-direction:row;align-items:center;gap:.6rem;font-weight:500}
.form .check input{width:20px;height:20px;accent-color:var(--indigo)}
.form .help{font-weight:400;color:var(--muted);font-size:.82rem;display:block}
.form .lbl-t{font-size:.9rem;font-weight:500}
.form .opts{margin:.6rem 0 .5rem}
.newcat{display:flex;gap:.5rem}
.newcat input{flex:1}
.photo{display:flex;gap:1rem;align-items:center}
.photo .thumb{width:96px;height:96px;border-radius:12px;background:var(--indigo-soft);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--muted);font-size:.78rem;text-align:center}
.photo .thumb img{width:100%;height:100%;object-fit:cover}
.photo .btns{display:flex;flex-wrap:wrap;gap:.5rem}
.photo .btn{min-height:38px;font-size:.88rem}
.form .foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.6rem;margin-top:1.5rem}
@media (max-width:560px){.form .fields{grid-template-columns:1fr}}

.toast{visibility:hidden;position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--ink);color:var(--bg);padding:.75rem 1.1rem;border-radius:12px;font-size:.92rem;z-index:50;transition:transform .25s ease;max-width:calc(100% - 2rem)}
.toast.show{visibility:visible;transform:translateX(-50%) translateY(0)}
.fab.btn{background:var(--ink);color:var(--bg)}
.fab{position:fixed;right:1.1rem;bottom:calc(1.1rem + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:var(--shadow)}
[hidden]{display:none!important}
.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);flex:none}
.dots{display:flex;align-items:center;gap:5px;margin-top:.45rem}
.dots .more{font-size:.78rem;color:var(--muted);margin-left:2px}
.color-chip{display:inline-flex;align-items:center;gap:.45rem}
.color-chip .swatch{width:16px;height:16px}
.opts .chip[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.color-list{display:grid;gap:.5rem;margin-top:.5rem}
.color-row{display:grid;grid-template-columns:44px 1fr auto;gap:.5rem;align-items:center}
.color-row input[type=color]{width:44px;height:40px;padding:2px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.color-row .btn{min-height:38px;font-size:.86rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

/* ---------- borrador y publicación ---------- */
function saveDraft(){
  dirty=true;
  try{localStorage.setItem(DRAFT_KEY,JSON.stringify({base:published.version,data:state}));}
  catch(e){toast('El borrador es muy grande para guardarse en este navegador. Descarga catalogo.json pronto para no perderlo.');}
}
function restoreDraft(){
  try{var raw=localStorage.getItem(DRAFT_KEY);if(!raw)return;var d=JSON.parse(raw);
    if(d&&d.base===published.version&&d.data){state=normalize(d.data);dirty=true;editMode=true;}
    else localStorage.removeItem(DRAFT_KEY);
  }catch(e){}
}
function discard(){
  askConfirm('¿Descartar los cambios sin publicar?','Descartar cambios').then(function(ok){
    if(!ok)return;state=clone(published);dirty=false;
    try{localStorage.removeItem(DRAFT_KEY);}catch(e){}
    render();toast('Cambios descartados.');
  });
}
function buildDocument(data){
  var css=document.getElementById('app-style').textContent;
  var js=document.getElementById('app-script').textContent;
  var json=JSON.stringify(data).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  return '<!doctype html>\n<html lang="es">\n<head>\n'+HEAD+'<style id="app-style">'+css+'</style>\n</head>\n<body>\n<div id="root"></div>\n<script id="catalog-data" type="application/json">'+json+'<\/script>\n<script id="app-script">'+js+'<\/script>\n</body>\n</html>\n';
}
function publicar(){
  var next=clone(state);next.version=Date.now();
  var blob=new Blob([JSON.stringify(next,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='catalogo.json';
  document.body.append(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  toast('Descargado. Súbelo a site/ en GitHub y la página se actualiza sola.');
}
function publicarClaude(){
  if(!artifactApi||publishing)return;
  publishing=true;render();
  var next=clone(state);next.version=Date.now();
  var html=buildDocument(next);
  var backup=null;try{backup=localStorage.getItem(DRAFT_KEY);localStorage.removeItem(DRAFT_KEY);}catch(e){}
  artifactApi.publish(html).then(function(){
    toast('Publicado. La página se va a recargar con los cambios.');
  },function(err){
    publishing=false;
    try{if(backup)localStorage.setItem(DRAFT_KEY,backup);}catch(e){}
    var code=err&&err.code;
    if(code==='conflict')toast('Se publicó otra versión al mismo tiempo; la página se va a recargar.');
    else if(code==='not_granted'||code==='not_writer')toast('Esta vista no tiene permiso para publicar.');
    else toast('No se pudo publicar'+(err&&err.message?': '+err.message:'')+'. Tus cambios siguen guardados aquí.');
    render();
  });
}

function resizeImage(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file);var img=new Image();
    img.onload=function(){
      var max=900,w=img.naturalWidth,hh=img.naturalHeight,s=Math.min(1,max/Math.max(w,hh));
      var cv=document.createElement('canvas');cv.width=Math.round(w*s);cv.height=Math.round(hh*s);
      var ctx=cv.getContext('2d');ctx.fillStyle='#FAFAF7';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);resolve(cv.toDataURL('image/jpeg',0.8));
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('imagen'));};
    img.src=url;
  });
}

  }
  paintCats();
  var selCols=(d.colores||[]).filter(function(id){return state.config.colores.some(function(c){return c.id===id;});});
  var colBox=h('div',{class:'opts',role:'group','aria-label':'Colores disponibles'});
  function paintCols(){
    colBox.textContent='';
    if(!state.config.colores.length){colBox.append(h('span',{class:'help'},'Aún no tienes colores. Créalos en Ajustes.'));return;}
    state.config.colores.forEach(function(c){var on=selCols.indexOf(c.id)>=0;
      colBox.append(h('button',{class:'chip color-chip',type:'button','aria-pressed':String(on),onclick:function(){
        if(on)selCols=selCols.filter(function(x){return x!==c.id;});else selCols.push(c.id);paintCols();}},swatch(c),c.nombre));});
    if(state.config.colores.length>1)colBox.append(h('button',{class:'chip',type:'button',onclick:function(){
      selCols=selCols.length===state.config.colores.length?[]:state.config.colores.map(function(c){return c.id;});paintCols();}},selCols.length===state.config.colores.length?'Quitar todos':'Todos'));
  }
  paintCols();
  var colField=h('div',{class:'full'},h('div',{class:'lbl-t'},'Colores disponibles'),h('span',{class:'help'},'Marca en qué colores se puede pedir. Déjalo sin marcar si no aplica, por ejemplo si lleva varios colores.'),colBox);
  var catField=h('div',{class:'full'},h('div',{class:'lbl-t'},'Categorías'),h('span',{class:'help'},'Marca una o varias. El producto aparece en cada sección que elijas.'),catBox,h('div',{class:'newcat'},fNewCat,h('button',{class:'btn btn-quiet',type:'button',onclick:addCat},'Agregar')));
  var fNombre=h('input',{type:'text',required:true,value:d.nombre,maxlength:'80'});
  var fPrecio=h('input',{type:'number',min:'0',step:'500',inputmode:'numeric',value:d.precio===''||d.precio==null?'':String(d.precio),placeholder:'Ej. 15000'});
  var fDesde=h('input',{type:'checkbox'});fDesde.checked=!!d.desde;
  var fMedidas=h('input',{type:'text',value:d.medidas,placeholder:'Ej. 8 × 6 × 2 cm'});
  var fPers=h('textarea',{placeholder:'Nombre o iniciales\nColor a elección\nTamaño grande'});fPers.value=(d.personalizacion||[]).join('\n');
  var fDesc=h('textarea',{placeholder:'Qué es, para qué sirve, material, cuidados…'});fDesc.value=d.descripcion||'';
  var fVis=h('input',{type:'checkbox'});fVis.checked=d.disponible!==false;
  var fDest=h('input',{type:'checkbox'});fDest.checked=!!d.destacado;
  var thumb=h('div',{class:'thumb'});
  function paintThumb(){thumb.textContent='';if(d.foto)thumb.append(h('img',{src:d.foto,alt:''}));else thumb.append('Sin foto');}
  paintThumb();
  var file=h('input',{type:'file',accept:'image/*',class:'sr',onchange:function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    resizeImage(f).then(function(src){d.foto=src;paintThumb();rmBtn.hidden=false;},function(){toast('No se pudo leer esa imagen. Prueba con JPG o PNG.');});
  }});
  var rmBtn=h('button',{class:'btn btn-quiet',type:'button',onclick:function(){d.foto='';paintThumb();rmBtn.hidden=true;}},'Quitar foto');
  rmBtn.hidden=!d.foto;
  var form=h('form',{class:'form',novalidate:true},
    h('h2',{id:'form-t'},nuevo?'Agregar producto':'Editar producto'),
    h('div',{class:'fields'},
      field('Nombre',fNombre,null,true),
      catField,
      colField,
      field('Precio (COP)',fPrecio,'Vacío = a cotizar'),
      field('Medidas',fMedidas,'Largo × ancho × alto'),
      h('label',{class:'check full'},fDesde,'Mostrar como “desde” (el precio puede subir según la personalización)'),
      field('Opciones de personalización',fPers,'Una opción por línea. El cliente las puede marcar al pedir.',true),
      field('Descripción',fDesc,null,true),
      h('div',{class:'full'},h('div',{style:'font-size:.9rem;font-weight:500;margin-bottom:.35rem'},'Foto'),
        h('div',{class:'photo'},thumb,h('div',{class:'btns'},h('label',{class:'btn btn-quiet'},d.foto?'Cambiar foto':'Subir foto',file),rmBtn))),
      h('label',{class:'check'},fVis,'Visible en el catálogo'),
      h('label',{class:'check'},fDest,'Destacado (sale primero)')
    ),
    h('div',{class:'foot'},
      h('button',{class:'btn btn-ghost',type:'button',onclick:function(){dlg.close();}},'Cancelar'),
      h('button',{class:'btn btn-indigo',type:'submit'},nuevo?'Agregar al catálogo':'Guardar cambios'))
  );
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var nombre=fNombre.value.trim();
    if(!nombre){fNombre.focus();toast('El producto necesita un nombre.');return;}
    addCat();d.nombre=nombre;d.categorias=selCats.slice();d.colores=state.config.colores.filter(function(c){return selCols.indexOf(c.id)>=0;}).map(function(c){return c.id;});delete d.categoria;
    var pr=fPrecio.value.trim();d.precio=pr===''?'':Math.max(0,Math.round(Number(pr)));
    d.desde=fDesde.checked;d.medidas=fMedidas.value.trim();
    d.personalizacion=fPers.value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    d.descripcion=fDesc.value.trim();d.disponible=fVis.checked;d.destacado=fDest.checked;
    if(nuevo){d.creado=Date.now();state.productos.unshift(d);}
    else{state.productos=state.productos.map(function(x){return x.id===d.id?d:x;});}
    saveDraft();dlg.close();render();
    toast(nuevo?'Producto agregado. Descarga catalogo.json para publicarlo.':'Cambios guardados. Descarga catalogo.json para publicarlos.');
  });
  var dlg=openDialog(form,'form-t');
  fNombre.focus();
}

function openSettings(){
  var c=state.config;
  var fWa=h('input',{type:'tel',value:c.whatsapp,placeholder:'Ej. 300 123 4567'});
  var fIg=h('input',{type:'text',value:c.instagram,placeholder:'enigmastudio.co'});
  var fIntro=h('textarea',null);fIntro.value=c.intro||'';
  var cols=clone(c.colores||[]);
  var colList=h('div',{class:'color-list'});
  function paintColList(){
    colList.textContent='';
    cols.forEach(function(col,i){
      colList.append(h('div',{class:'color-row'},
        h('input',{type:'color',value:col.hex,'aria-label':'Tono de '+(col.nombre||'color'),oninput:function(e){col.hex=e.target.value;}}),
        h('input',{type:'text',value:col.nombre,placeholder:'Nombre del color','aria-label':'Nombre del color',oninput:function(e){col.nombre=e.target.value;}}),
        h('button',{class:'btn btn-quiet',type:'button',onclick:function(){cols.splice(i,1);paintColList();}},'Quitar')));
    });
  }
  paintColList();
  var form=h('form',{class:'form'},
    h('h2',{id:'set-t'},'Ajustes de la página'),
    h('div',{class:'fields'},
      field('WhatsApp',fWa,'Número de 10 dígitos; se agrega el +57 solo. Déjalo vacío para usar solo Instagram.'),
      field('Instagram',fIg,'Solo el usuario, sin @. Déjalo vacío para usar solo WhatsApp.'),
      field('Texto de bienvenida',fIntro,'Aparece debajo del título principal.',true),
      h('div',{class:'full'},h('div',{class:'lbl-t'},'Colores'),h('span',{class:'help'},'Los colores que manejas. En cada producto marcas cuáles aplican.'),colList,
        h('button',{class:'btn btn-quiet',type:'button',style:'margin-top:.6rem',onclick:function(){cols.push({id:uid(),nombre:'',hex:'#8ECDF5'});paintColList();var ins=colList.querySelectorAll('input[type=text]');ins[ins.length-1].focus();}},'Agregar color'))),
    h('div',{class:'foot'},
      h('button',{class:'btn btn-ghost',type:'button',onclick:function(){dlg.close();}},'Cancelar'),
      h('button',{class:'btn btn-indigo',type:'submit'},'Guardar ajustes'))
  );
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var colores=cols.filter(function(x){return x.nombre.trim();}).map(function(x){return {id:x.id,nombre:x.nombre.trim(),hex:x.hex};});
    var ids=colores.map(function(x){return x.id;});
    state.productos.forEach(function(p){p.colores=(p.colores||[]).filter(function(id){return ids.indexOf(id)>=0;});});
    state.config={whatsapp:fWa.value.trim(),instagram:fIg.value.trim().replace(/^@/,''),intro:fIntro.value.trim(),colores:colores};
    saveDraft();dlg.close();render();toast('Ajustes guardados. Descarga catalogo.json para publicarlos.');
  });
  var dlg=openDialog(form,'set-t');
}

function askConfirm(msg,okLabel){
  return new Promise(function(resolve){
    var res=false;
    var body=h('div',{class:'form'},h('h2',{id:'cf-t'},msg),h('div',{class:'foot'},
      h('button',{class:'btn btn-ghost',type:'button',onclick:function(){dlg.close();}},'Cancelar'),
      h('button',{class:'btn btn-danger',type:'button',onclick:function(){res=true;dlg.close();}},okLabel)));
    var dlg=openDialog(body,'cf-t');
    dlg.style.width='min(440px, 100vw - 1.5rem)';
    dlg.addEventListener('close',function(){resolve(res);});
  });
}

var toastEl=h('div',{class:'toast',role:'status','aria-live':'polite'});var toastT;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('show');},3800);}

render();
cargar();
window.addEventListener('hashchange',function(){if(location.hash==='#editar'&&!canEdit){canEdit=true;editMode=true;restoreDraft();render();}});
var hash=(location.hash||'').slice(1);
if(hash==='catalogo'||hash==='como-pedir')setTimeout(function(){scrollToId(hash);},50);
})();
</script>
</body>
</html>
